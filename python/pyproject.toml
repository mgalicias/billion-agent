[project]
name = "backtester"
version = "0.1.0"
description = "Event-driven backtester replaying the canonical market-data schema shared with the Rust feed handler."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtester*"]
